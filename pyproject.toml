[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-researcher-x402-retriever"
version = "0.1.0"
description = "Keyless pay-per-call web-search retriever for GPT Researcher, paid over x402 in Nano (XNO) through a pluggable payer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dhyabi2" }]
keywords = ["gpt-researcher", "retriever", "x402", "nano", "xno", "web-search", "agent-payments"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
feeless402 = ["feeless402>=0.2.9"]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/dhyabi2/gpt-researcher-x402-retriever"

[project.entry-points."gpt_researcher.retrievers"]
paypercall = "gpt_researcher_x402_retriever:PayPerCallSearch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real endpoint (set X402_LIVE=1)"]

name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      # Best effort: with it, the Feeless402Payer money-path tests run; without it
      # they skip. It must never fail the build, since it is an optional extra.
      - run: pip install -e ".[feeless402]" || echo "feeless402 unavailable; payer tests will skip"
      - run: pytest -q
